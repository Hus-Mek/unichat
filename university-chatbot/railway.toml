[build]
builder = "dockerfile"
dockerfilePath = "university-chatbot/docker/Dockerfile.backend"
watchPatterns = ["university-chatbot/backend/**"]

[deploy]
startCommand = "cd /app && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
